<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workpacks">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314191D'/%3E%3Cpath d='M16 34l10 10 22-24' fill='none' stroke='%23F2B33D' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Workpack Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: phone-first single column; widens to a card grid on a desk screen. Dark header bar, white cards, status colours carry meaning. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#14191D; --muted:#46505A; --line:#D2D8DC;
  --head:#14191D; --head-ink:#FFFFFF; --head-muted:#C3CAD0;
  --accent:#1F4E79; --accent-ink:#FFFFFF;
  --late:#A12019; --late-ink-on:#FFFFFF; --late-bg:#FBEAE9; --late-line:#E6B0AC; --late-ink:#7A1A14;
  --warn-bg:#FFF4DC; --warn-line:#E6C373; --warn-ink:#674500;
  --prog:#F2B33D; --prog-ink:#14191D; --prog-line:#B07A10;
  --done:#1E6B3A; --done-ink:#FFFFFF;
  --not:#46505A; --not-ink:#FFFFFF;
  --chip:#E7EBEE; --track:#DEE3E7; --off-line:#A3ACB4;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1214; --surface:#1A2024; --ink:#ECEFF1; --muted:#A8B1B9; --line:#2F383E;
  --head:#080B0D; --head-ink:#FFFFFF; --head-muted:#A8B1B9;
  --accent:#6FA6DA; --accent-ink:#08131D;
  --late:#C2362E; --late-ink-on:#FFFFFF; --late-bg:#381614; --late-line:#6B2A26; --late-ink:#F4BDB8;
  --warn-bg:#352909; --warn-line:#6B5313; --warn-ink:#F2D38A;
  --prog:#F2B33D; --prog-ink:#14191D; --prog-line:#F2B33D;
  --done:#2F8A52; --done-ink:#FFFFFF;
  --not:#6B7680; --not-ink:#FFFFFF;
  --chip:#262E33; --track:#2A3338; --off-line:#4F5A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1214; --surface:#1A2024; --ink:#ECEFF1; --muted:#A8B1B9; --line:#2F383E;
  --head:#080B0D; --head-ink:#FFFFFF; --head-muted:#A8B1B9;
  --accent:#6FA6DA; --accent-ink:#08131D;
  --late:#C2362E; --late-ink-on:#FFFFFF; --late-bg:#381614; --late-line:#6B2A26; --late-ink:#F4BDB8;
  --warn-bg:#352909; --warn-line:#6B5313; --warn-ink:#F2D38A;
  --prog:#F2B33D; --prog-ink:#14191D; --prog-line:#F2B33D;
  --done:#2F8A52; --done-ink:#FFFFFF;
  --not:#6B7680; --not-ink:#FFFFFF;
  --chip:#262E33; --track:#2A3338; --off-line:#4F5A62; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.bar{background:var(--head);color:var(--head-ink)}
.bar .wrap{padding-block:16px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;text-transform:uppercase;line-height:1.05}
.sub{font-size:16px;color:var(--head-muted)}
.sub button{background:none;border:0;padding:0;color:var(--head-ink);text-decoration:underline;font-size:16px;min-height:32px}
.mode{display:inline-block;margin-top:4px;font-size:14px;font-weight:700;background:var(--prog);color:var(--prog-ink);border-radius:6px;padding:2px 8px;align-self:flex-start}
.filters{background:var(--surface);border-bottom:1px solid var(--line)}
.filters .wrap{padding-block:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.filters .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.lbl{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
select.big{height:56px;font-size:22px;font-weight:600;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);width:100%}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dates label{font-size:15px;color:var(--muted)}
input.date{height:52px;width:100%;font-size:19px;font-weight:600;padding:0 10px;border:2px solid var(--off-line);border-radius:10px;background:var(--surface);min-width:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--off-line);background:var(--surface);font-size:16px;font-weight:700}
.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:14px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:15px;color:var(--muted);line-height:1.2}
.tile.late{background:var(--late-bg);border-color:var(--late-line)} .tile.late b,.tile.late span{color:var(--late-ink)}
.tile.warn{background:var(--warn-bg);border-color:var(--warn-line)} .tile.warn b,.tile.warn span{color:var(--warn-ink)}
h2{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0;text-wrap:balance}
.sec{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:10px;align-items:flex-start}
.grow{flex:1 1 auto;min-width:0}
.wpid{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.wpdesc{font-size:19px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.btn{height:52px;min-width:76px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;flex:0 0 auto}
.btn.ghost{background:transparent;border:2px solid var(--done);color:var(--done)}
.btn.wide{width:100%}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:2px 10px;border-radius:6px;font-size:16px;font-weight:700;background:var(--chip);color:var(--ink)}
.badge.late{background:var(--late);color:var(--late-ink-on)}
.badge.who{font-weight:600;color:var(--muted)}
.badge.site{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.check{display:flex;align-items:center;gap:12px;min-height:52px;font-size:19px;font-weight:600;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--accent);flex:0 0 auto}
.track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;background:var(--done)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.stale{color:var(--warn-ink);font-weight:700}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 14px;border-radius:12px;border:2px dashed var(--off-line);background:transparent;color:var(--muted);font-size:19px;font-weight:700}
.fold svg{transition:transform .15s}
.fold[aria-expanded="true"] svg{transform:rotate(180deg)}
.empty{padding:18px;border:1px dashed var(--off-line);border-radius:12px;color:var(--muted);font-size:17px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
nav.tabs button{height:64px;border:0;border-top:4px solid transparent;background:none;font-size:19px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent);font-weight:700}
main{padding-bottom:100px}
/* Screen 2 */
.wphead{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.wphead .wrap{padding-block:10px 14px;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--head-ink);font-size:18px;font-weight:600;padding:0;align-self:flex-start}
.update{height:62px;border-radius:12px;border:0;background:var(--prog);color:var(--prog-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1.1;width:100%}
.update small{font-size:15px;font-weight:600}
.update:disabled{opacity:.6}
.task{gap:10px}
.tid{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.grp{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;overflow-wrap:anywhere}
.tname{font-size:20px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.changed{background:var(--accent);color:var(--accent-ink);border-radius:6px;font-size:13px;font-weight:700;padding:3px 8px;letter-spacing:.5px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{height:56px;border-radius:10px;border:2px solid var(--off-line);background:var(--surface);color:var(--ink);font-size:17px;font-weight:700;line-height:1.1;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button[aria-pressed="true"].s-N{background:var(--not);border-color:var(--not);color:var(--not-ink)}
.seg button[aria-pressed="true"].s-P{background:var(--prog);border-color:var(--prog-line);color:var(--prog-ink)}
.seg button[aria-pressed="true"].s-C{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.seg button svg{display:none}
.seg button[aria-pressed="true"] svg{display:block}
.note{font-size:16px;color:var(--muted);line-height:1.4}
.confirm{border:2px solid var(--done);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.confirm .row{flex-wrap:wrap}
/* Stats */
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.k b{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.k b small{font-size:20px;color:var(--muted)}
.k .t{font-size:17px;font-weight:700;color:var(--muted)}
.k .d{font-size:15px;color:var(--muted)}
.k.late{background:var(--late-bg);border-color:var(--late-line)} .k.late b,.k.late .t,.k.late .d{color:var(--late-ink)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:16px}
.barrow .b{height:18px;border-radius:4px;background:var(--track);overflow:hidden}
.barrow .b i{display:block;height:100%;background:var(--late)}
.barrow .n{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;min-height:56px}
.li:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:14px;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;background:var(--chip);letter-spacing:.4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px;border-top:1px solid var(--line);text-align:right;font-size:18px}
.tbl td.r{color:var(--late);font-weight:700} .tbl td.w{color:var(--warn-ink);font-weight:700}
.scroll{overflow-x:auto}
.fresh{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;color:var(--warn-ink)}
.fresh b{font-family:var(--display);font-size:36px;line-height:1}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;font-size:17px;padding:8px 0;min-height:44px;align-self:flex-start}
/* overlays + toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.overlay .wrap{padding-block:24px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.namebtn{height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:21px;font-weight:700;text-align:left;padding:0 16px}
input.text{height:56px;font-size:21px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);width:100%}
.err{color:var(--late);font-weight:700;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:18px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--warn-line)}
.banner .wrap{padding-block:10px;font-size:16px;font-weight:600}
/* Reports: on screen and in print */
.filters .btn.wide{align-self:end}
.rep{display:flex;flex-direction:column;gap:18px;padding-block:18px 0}
.rperson{display:flex;flex-direction:column;gap:12px}
.rhead{border-bottom:3px solid var(--ink);padding-bottom:8px;display:flex;flex-direction:column;gap:2px}
.reye{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.rhead h1{font-family:var(--display);font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.4px;text-wrap:balance}
.rmeta{font-size:15px;color:var(--muted)}
.rkpi{display:flex;gap:18px;flex-wrap:wrap;font-size:16px}
.rkpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.rlate{color:var(--late)}
.rep h3{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 0}
.rwp{display:flex;flex-direction:column;gap:4px;break-inside:avoid-page}
.rwph{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rid{font-family:var(--display);font-weight:700;font-size:20px}
.rdesc{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere}
.rsum{font-size:15px;color:var(--muted)}
.rt{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface)}
.rt th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--chip);padding:6px 8px;border-bottom:1px solid var(--line)}
.rt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rt .num{text-align:right}
.rt .nw{white-space:nowrap}
.rt tr.lt td:last-child{color:var(--late);font-weight:700}
.rt tr.dn td{color:var(--muted)}
.rt.kv th{width:55%;text-transform:none;font-size:15px;letter-spacing:0;color:var(--ink);background:transparent;font-weight:600}
.rg{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#bbb;--chip:#eee;--late:#A12019;color-scheme:light}
  html,body{background:#fff!important;color:#000}
  .bar,.banner,.noprint,nav.tabs,.toast{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .rep{padding:0;gap:10px}
  .scroll{overflow:visible}
  .rt{font-size:9pt}
  .rt th{font-size:8pt}
  .rt td,.rt th{padding:3px 5px}
  .rhead h1{font-size:18pt}
  .rid{font-size:12pt} .rdesc{font-size:11pt} .rsum,.rmeta,.rkpi{font-size:9pt} .rkpi b{font-size:13pt}
  .rep h3{font-size:12pt}
  .rt tr{break-inside:avoid}
  .pb{break-before:page}
}

.rvbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 14px;border-radius:12px;border:2px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);font-size:18px;text-align:left;min-height:64px}
.rvbar b{font-size:19px}
/* Tanks */
.disc{display:grid;gap:4px}
.dc{border-radius:8px;padding:6px 2px;text-align:center;font-size:14px;font-weight:700;line-height:1.15;border:2px solid transparent;min-width:0;overflow:hidden}
.dc small{display:block;font-size:12px;font-weight:600}
.dc.C{background:var(--done);color:var(--done-ink)} .dc.P{background:var(--prog);color:var(--prog-ink)}
.dc.N{background:var(--surface);border-color:var(--off-line);color:var(--ink)} .dc.X{background:var(--chip);color:var(--muted);font-weight:600}
.dc.B{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:600}
.dc.L{box-shadow:0 0 0 3px var(--late)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:3px solid var(--ink);padding-top:8px;margin-top:8px}
.dhead h3{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.4px}
.mine{font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:6px}
.tbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px 20px}
.tbar .dh{display:flex;justify-content:space-between;gap:8px;font-size:15px;flex-wrap:wrap} .tbar .dh span{color:var(--muted)}
.stk{display:flex;gap:2px;height:12px;background:var(--track);border-radius:4px;overflow:hidden;margin:4px 0} .stk i{display:block;height:100%}
.stk i.C{background:var(--done)} .stk i.P{background:var(--prog)}
.dn{font-size:14px;color:var(--muted)}
.wrap.rep.wide{max-width:none}
.trep{display:flex;flex-direction:column;gap:10px}
.ttop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 24px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.ttop h1{font-family:var(--display);font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.4px;line-height:1.05}
.tkp{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px} .tkp b{font-family:var(--display);font-size:22px;color:var(--ink);display:block;line-height:1}
.tkp .lt b{color:var(--late)}
.tlg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;align-content:start} .tlg div{display:flex;align-items:center;gap:6px}
.tmx{border-collapse:collapse;width:100%;min-width:980px;font-size:13px;background:var(--surface)}
.tmx th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:4px;border-bottom:1px solid var(--line);color:var(--muted)}

<script>
/* Schedule import: turns the Primavera Excel export (with Workpack / Responsible /
   Status columns added) into the app's schedule data.
   Works in the browser (window.WPParse) and in Node (module.exports). */
(function (root) {
  'use strict';

  // Only these phases are shown in the app. Add 'MECHANICAL COMPLETION' etc. later if wanted.
  var INCLUDE_PHASES = ['CONSTRUCTION'];
  var ALL_PHASES = ['ENGINEERING', 'PROCUREMENT', 'CONSTRUCTION', 'MECHANICAL COMPLETION',
    'PRE-COMM & COMMISIONING', 'PRE-COMM & COMMISSIONING'];
  // In these workpacks each "TAG - DESCRIPTION" group (one vessel) becomes a single task.
  var COLLAPSE_WORKPACKS = ['0000-0009'];

  var MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  var WP_RE = /^(\d{4}-\d{4})\s*-\s*(.*)$/;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }

  // Excel serial number or "15-Jan-26 A" / "21-Sep-26*" -> "2026-01-15"
  function toDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') {
      var ms = Math.round((v - 25569) * 86400000);
      var dt = new Date(ms);
      return iso(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    }
    if (v instanceof Date) return iso(v.getFullYear(), v.getMonth(), v.getDate());
    var m = String(v).match(/(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/);
    if (!m) return null;
    var y = parseInt(m[3], 10); if (y < 100) y += 2000;
    var mo = MONTHS[m[2].toLowerCase()];
    if (mo === undefined) return null;
    return iso(y, mo, parseInt(m[1], 10));
  }
  function isActual(v) { return typeof v === 'string' && /\sA\s*$/.test(v); }
  function derive(start, finish) {
    if (isActual(finish)) return 'C';
    if (isActual(start)) return 'P';
    return 'N';
  }
  function statusCode(v) {
    var s = String(v || '').trim().toLowerCase();
    if (s === 'complete' || s === 'completed') return 'C';
    if (s === 'in progress') return 'P';
    if (s === 'not started') return 'N';
    return null;
  }
  function indent(s) { var m = String(s).match(/^ */); return m ? m[0].length : 0; }

  // rows: array of arrays (raw cell values). Returns {workpacks, tasks, warnings}
  function parseRows(rows, sourceName) {
    var hi = -1, col = {};
    for (var i = 0; i < Math.min(rows.length, 30) && hi < 0; i++) {
      var r = rows[i] || [];
      for (var j = 0; j < r.length; j++) {
        if (String(r[j] || '').trim().toLowerCase() === 'activity id') { hi = i; break; }
      }
    }
    if (hi < 0) throw new Error('Could not find the "Activity ID" header row.');
    rows[hi].forEach(function (h, j) { if (h !== null && h !== undefined) col[String(h).trim().toLowerCase()] = j; });
    ['activity id', 'activity name', 'start', 'finish', 'responsible'].forEach(function (k) {
      if (col[k] === undefined) throw new Error('Missing column "' + k + '".');
    });

    var workpacks = [], tasks = [], warnings = [], seen = {};
    var wp = null, phase = null, stack = [], collapse = null;

    for (var k = hi + 1; k < rows.length; k++) {
      var row = rows[k] || [];
      var raw = row[col['activity id']];
      if (raw === null || raw === undefined || String(raw).trim() === '') continue;
      var text = String(raw), lvl = indent(text), s = text.trim();
      var name = row[col['activity name']];
      var isGroup = name === null || name === undefined || String(name).trim() === '';

      if (wp && lvl <= wp.lvl) { wp = null; phase = null; collapse = null; stack = []; }

      var m = isGroup ? s.match(WP_RE) : null;
      if (m) {
        var resp = String(row[col['responsible']] || '').trim();
        wp = { id: m[1], desc: m[2].trim(), resp: resp, lvl: lvl, n: 0 };
        workpacks.push(wp); phase = null; collapse = null; stack = [];
        if (!resp) warnings.push(m[1] + ' has no Responsible person.');
        continue;
      }
      if (!wp) continue;

      if (isGroup && ALL_PHASES.indexOf(s.toUpperCase()) >= 0) {
        phase = s.toUpperCase(); collapse = null; stack = [];
        continue;
      }
      if (INCLUDE_PHASES.indexOf(phase) < 0) continue;

      if (collapse) { if (lvl > collapse) continue; collapse = null; }
      while (stack.length && stack[stack.length - 1].lvl >= lvl) stack.pop();
      var grp = stack.length ? stack[stack.length - 1].name : '';

      var st = row[col['start']], fi = row[col['finish']];
      var t = null;
      if (isGroup) {
        // A vessel is a group nested inside a sub-group (e.g. FABRIC MAINTENANCE > 21-V-0002 - DUMP DRUM)
        if (COLLAPSE_WORKPACKS.indexOf(wp.id) >= 0 && stack.length > 0) {
          var dash = s.indexOf(' - ');
          var tm = dash > 0 ? [s, s.slice(0, dash).trim(), s.slice(dash + 3).trim()]
            : (s.match(/^(\S+)\s+(.*)$/) || [s, s, s]);
          var vid = tm[1], nth = 2;
          while (seen[vid]) vid = tm[1] + ' #' + (nth++); // same vessel listed under two scopes
          t = { id: vid, name: tm[2] || tm[1], grp: grp, p6: derive(st, fi) };
          collapse = lvl;
        } else {
          stack.push({ lvl: lvl, name: s });
          continue;
        }
      } else {
        var sc = col['status'] !== undefined ? statusCode(row[col['status']]) : null;
        t = { id: s, name: String(name).trim(), grp: grp, p6: sc || derive(st, fi) };
      }
      t.wp = wp.id;
      t.start = toDate(st) || toDate(fi);
      t.finish = toDate(fi) || t.start;
      if (seen[t.id]) { warnings.push('Duplicate task ID ' + t.id + ' (kept the first).'); continue; }
      seen[t.id] = 1;
      tasks.push(t); wp.n++;
    }

    var out = workpacks.filter(function (w) { return w.n > 0; }).map(function (w) {
      return { id: w.id, desc: w.desc, resp: w.resp };
    });
    return {
      v: 1,
      source: sourceName || '',
      imported: new Date().toISOString(),
      phases: INCLUDE_PHASES,
      workpacks: out,
      tasks: tasks.map(function (t) {
        return { id: t.id, wp: t.wp, name: t.name, grp: t.grp, start: t.start, finish: t.finish, p6: t.p6 };
      }),
      warnings: warnings
    };
  }

  // XLSX = the SheetJS library; data = ArrayBuffer of the .xlsx file
  function parseWorkbook(XLSX, data, sourceName) {
    var wb = XLSX.read(data, { type: 'array', cellDates: false });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
    return parseRows(rows, sourceName);
  }

  // ---------- Site items list: flat table, one row per item ----------
  // Columns (header names, any order): Group No, Group Description, Responsible, Item ID,
  // Item Description, Start, Finish, Status. Dates and Status are optional.
  function parseSiteRows(rows, sourceName) {
    var hi = -1, col = {};
    for (var i = 0; i < Math.min(rows.length, 30) && hi < 0; i++) {
      var r = rows[i] || [];
      for (var j = 0; j < r.length; j++) {
        if (String(r[j] || '').trim().toLowerCase() === 'item id') { hi = i; break; }
      }
    }
    if (hi < 0) throw new Error('Could not find the "Item ID" header row. Use the Site Items template.');
    rows[hi].forEach(function (h, j) { if (h !== null && h !== undefined) col[String(h).trim().toLowerCase()] = j; });
    ['group no', 'item id', 'item description'].forEach(function (k) {
      if (col[k] === undefined) throw new Error('Missing column "' + k + '".');
    });
    var get = function (row, k) { var v = col[k] === undefined ? null : row[col[k]]; return (v === undefined || v === '') ? null : v; };
    var groups = {}, order = [], tasks = [], warnings = [], seen = {};
    for (var k = hi + 1; k < rows.length; k++) {
      var row = rows[k] || [];
      var id = get(row, 'item id'), g = get(row, 'group no');
      if (id === null && g === null) continue;
      if (id === null) { warnings.push('Row ' + (k + 1) + ' has a Group No but no Item ID (skipped).'); continue; }
      if (g === null) { warnings.push('Item ' + id + ' has no Group No (skipped).'); continue; }
      id = String(id).trim(); g = String(g).trim();
      if (seen[id]) { warnings.push('Duplicate Item ID ' + id + ' (kept the first).'); continue; }
      seen[id] = 1;
      var resp = String(get(row, 'responsible') || '').trim();
      if (!groups[g]) { groups[g] = { id: g, desc: String(get(row, 'group description') || g).trim(), resp: resp, site: true }; order.push(g); }
      else if (resp && !groups[g].resp) groups[g].resp = resp;
      else if (resp && resp !== groups[g].resp) warnings.push(id + ': Responsible "' + resp + '" differs from its group (' + groups[g].resp + '); the group’s name is used.');
      var st = toDate(get(row, 'start')), fi = toDate(get(row, 'finish'));
      tasks.push({ id: id, wp: g, name: String(get(row, 'item description') || '').trim(), grp: '',
        start: st, finish: fi, p6: statusCode(get(row, 'status')) || 'N' });
    }
    var wps = order.map(function (g) { var w = groups[g]; if (!w.resp) { w.resp = 'Unassigned'; warnings.push('Group ' + g + ' has no Responsible (shown as Unassigned).'); } return w; });
    return { v: 1, kind: 'site', source: sourceName || '', imported: new Date().toISOString(), workpacks: wps, tasks: tasks, warnings: warnings };
  }
  function parseSiteWorkbook(XLSX, data, sourceName) {
    var wb = XLSX.read(data, { type: 'array', cellDates: false });
    var name = wb.SheetNames.filter(function (n) { return n.trim().toLowerCase() === 'site items'; })[0] || wb.SheetNames[0];
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
    return parseSiteRows(rows, sourceName);
  }

  // ---------- Tanks and seachests tracker: one row per tank, items across ----------
  // Three header rows: discipline (merged across its columns), item name (merged over Req/Start/Finish)
  // or "Responsible", then Req / Start / Finish. Disciplines and items are read from the headers,
  // so adding an item column in the template needs no code change.
  function parseTankRows(rows, sourceName) {
    var h1 = -1;
    for (var i = 0; i < Math.min(rows.length, 30) && h1 < 0; i++) {
      if (String((rows[i] || [])[0] || '').trim().toLowerCase() === 'tank id') h1 = i;
    }
    if (h1 < 0) throw new Error('Could not find the "Tank ID" header. Use the Tanks and Seachests template.');
    var r1 = rows[h1] || [], r2 = rows[h1 + 1] || [], r3 = rows[h1 + 2] || [];
    var width = Math.max(r1.length, r2.length, r3.length);
    var disc = '', item = '', discs = [], cols = [], respCol = {};
    var cap = function (s) { s = String(s).trim().toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
    for (var c = 2; c < width; c++) {
      if (r1[c] !== null && r1[c] !== undefined && String(r1[c]).trim()) { disc = cap(r1[c]); if (discs.indexOf(disc) < 0) discs.push(disc); }
      var v2 = r2[c] !== null && r2[c] !== undefined ? String(r2[c]).trim() : '';
      var v3 = r3[c] !== null && r3[c] !== undefined ? String(r3[c]).trim().toLowerCase() : '';
      if (!disc) continue;
      if (v2.toLowerCase() === 'responsible') { respCol[disc] = c; item = ''; continue; }
      if (v2) item = v2;
      if (!item) continue;
      var e = cols.filter(function (x) { return x.disc === disc && x.item === item; })[0];
      if (!e) { e = { disc: disc, item: item }; cols.push(e); }
      if (v3 === 'req' || v3 === 'required') e.req = c;
      else if (v3 === 'start') e.start = c;
      else if (v3 === 'finish') e.finish = c;
    }
    cols = cols.filter(function (x) { return x.req !== undefined; });
    if (!cols.length) throw new Error('No item columns found (each item needs a "Req" column).');
    var tanks = [], items = [], warnings = [], seen = {};
    for (var k = h1 + 3; k < rows.length; k++) {
      var row = rows[k] || [];
      var id = row[0] === null || row[0] === undefined ? '' : String(row[0]).trim();
      var nm = row[1] === null || row[1] === undefined ? '' : String(row[1]).trim();
      if (!id && !nm) continue;
      if (!id) { warnings.push('Row ' + (k + 1) + ' (' + nm + ') has no Tank ID (skipped).'); continue; }
      if (seen[id]) { warnings.push('Duplicate Tank ID ' + id + ' (kept the first).'); continue; }
      seen[id] = 1;
      tanks.push({ id: id, name: nm || id, seachest: /^sc/i.test(id) });
      cols.forEach(function (e) {
        var rq = String(row[e.req] || '').trim().toUpperCase();
        if (rq !== 'Y' && rq !== 'N') return;          // blank = not yet decided: not shown, not counted
        var resp = respCol[e.disc] !== undefined ? String(row[respCol[e.disc]] || '').trim() : '';
        items.push({ id: 'TK|' + id + '|' + e.item, tank: id, disc: e.disc, item: e.item, req: rq,
          resp: resp || 'Unassigned', start: e.start !== undefined ? toDate(row[e.start]) : null,
          finish: e.finish !== undefined ? toDate(row[e.finish]) : null, p6: 'N' });
      });
    }
    return { v: 1, kind: 'tanks', source: sourceName || '', imported: new Date().toISOString(),
      disciplines: discs.map(function (d) { return { name: d, items: cols.filter(function (x) { return x.disc === d; }).map(function (x) { return x.item; }) }; }),
      tanks: tanks, items: items, warnings: warnings };
  }
  function parseTankWorkbook(XLSX, data, sourceName) {
    var wb = XLSX.read(data, { type: 'array', cellDates: false });
    var name = wb.SheetNames.filter(function (n) { return n.trim().toLowerCase() === 'tanks and seachests'; })[0];
    if (!name) name = wb.SheetNames.filter(function (n) {
      var r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }).slice(0, 30);
      return r.some(function (x) { return String((x || [])[0] || '').trim().toLowerCase() === 'tank id'; });
    })[0] || wb.SheetNames[0];
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
    return parseTankRows(rows, sourceName);
  }

  var api = { parseRows: parseRows, parseWorkbook: parseWorkbook, parseSiteRows: parseSiteRows, parseSiteWorkbook: parseSiteWorkbook,
    parseTankRows: parseTankRows, parseTankWorkbook: parseTankWorkbook, toDate: toDate };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.WPParse = api;
})(this);

</script>

(function(){

var app = document.getElementById('app');

function pad(n){return (n<10?'0':'')+n;}

function diff(a,b){ var pa=a.split('-'),pb=b.split('-'); return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/86400000); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso){ if(!iso) return '–'; var p=iso.split('-'); return pad(+p[2])+' '+MON[+p[1]-1]; }
function fmtY(iso){ if(!iso) return '–'; var p=iso.split('-'); return pad(+p[2])+' '+MON[+p[1]-1]+' '+p[0]; }

function cmp(a,b){ return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}); }
var CHEV='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

var toastT;

/* ---------- data access (demo = this phone only, live = Cloudflare) ---------- */
function pin(){ return ls('pin')||''; }
function api(path,opts){

var IDX=null;
// Schedule workpacks and site item groups share one index; site groups carry site:true.
function index(){
  var byWp={}, tasks={}, wps={}, people={}, allW=[], allT=[];
  var site=S.site||{workpacks:[],tasks:[]};
  S.sched.workpacks.forEach(function(w){ allW.push(w); });
  site.workpacks.forEach(function(w){ if(!S.sched.workpacks.some(function(x){return x.id===w.id;})) allW.push(Object.assign({},w,{site:true})); });
  allW.forEach(function(w){ wps[w.id]=w; if(w.resp) people[w.resp]=1; });
  S.sched.tasks.forEach(function(t){ allT.push(t); });
  site.tasks.forEach(function(t){ if(!tasks[t.id]) allT.push(Object.assign({},t,{site:true})); });
  allT.forEach(function(t){ if(tasks[t.id]||!wps[t.wp]) return; (byWp[t.wp]=byWp[t.wp]||[]).push(t); tasks[t.id]=t; });
  Object.keys(byWp).forEach(function(k){ byWp[k].sort(function(a,b){return cmp(a.id,b.id);}); });
  // Tanks and seachests: required (Y) items are tracked; N = not required; blank cells are not imported
  var tk=S.tanks||{disciplines:[],tanks:[],items:[]}, byTank={}, tkById={}, tkPeople={};
  tk.tanks.forEach(function(t){ byTank[t.id]=[]; tkById[t.id]=t; });
  tk.items.forEach(function(it){ if(!byTank[it.tank]) return; var x=Object.assign({},it,{tank:true,tankId:it.tank}); byTank[it.tank].push(x);
    if(it.req==='Y'){ tasks[it.id]=x; if(it.resp) tkPeople[it.resp]=1; } });
  var all=Object.assign({},people,tkPeople);
  IDX={byWp:byWp,tasks:tasks,wps:wps,allW:allW,allT:allT.filter(function(t){return tasks[t.id]===t;}),people:Object.keys(people).sort(cmp),
    allPeople:Object.keys(all).sort(cmp),tkPeople:Object.keys(tkPeople).sort(cmp),
    hasSite:site.tasks.length>0, tk:{discs:tk.disciplines||[],tanks:tk.tanks,byTank:byTank,byId:tkById,has:tk.tanks.length>0,source:tk.source,imported:tk.imported,count:tk.items.length}};
}
function due(t){ return !t.start || t.start<=S.to; }

function eff(id){ var s=S.status[id], t=IDX.tasks[id]; return s?s.s:(t?t.p6:'N'); }
var ACTIVE_DAYS=14;

function isActive(i){ return !i.closed && (i.prog>0 || i.done>0 || (i.minOpenStart!==null && i.minOpenStart<=addDays(todayISO(),ACTIVE_DAYS))); }
function late(t,st,today){
  if(st!=='C' && t.finish && t.finish<today) return {kind:'finish',days:diff(t.finish,today)};
  if(st==='N' && t.start && t.start<today) return {kind:'start',days:diff(t.start,today)};
  return null;
}
function wpInfo(id){
  var today=todayISO(), ts=IDX.byWp[id]||[], done=0, prog=0, lates=[], worst=null, minStart=null, maxFin=null, minOpenStart=null;
  ts.forEach(function(t){
    var st=eff(t.id); if(st==='C') done++; else if(st==='P') prog++;
    var ks=t.start||''; // no start date = due now
    if(st!=='C' && (minOpenStart===null||ks<minOpenStart)) minOpenStart=ks;
    if(t.start&&(!minStart||t.start<minStart)) minStart=t.start; if(t.finish&&(!maxFin||t.finish>maxFin)) maxFin=t.finish;
    var l=late(t,st,today); if(l){ lates.push(l); if(!worst||l.days>worst.days||(l.days===worst.days&&l.kind==='finish')) worst=l; }
  });

  var label=closed?'Complete':(done||prog)?'In progress':(minOpenStart&&minOpenStart>today?'Starts '+fmt(minOpenStart):'Not started');
  var rv=S.reviews[id], rdays=rv?diff(rv.at.slice(0,10),today):null;
  return {id:id,total:ts.length,done:done,prog:prog,closed:closed,lates:lates,worst:worst,label:label,minStart:minStart,maxFin:maxFin,
    minOpenStart:minOpenStart,review:rv,stale:!rv||rdays>STALE_DAYS};
}
function lateText(l){ return l.kind==='finish'?(l.days+(l.days===1?' day late':' days late')):('Start '+l.days+(l.days===1?' day late':' days late')); }

function computeStats(resp){
  var today=todayISO(), ids=wpsFor(resp,'sched');
  var c={active:0,wpOpen:0,wpClosed:0,tDone:0,tProg:0,tAll:0,lStart:0,lFin:0,lateDays:[],wpLate:0,push:[],unrev:[],freshN:0,
    buckets:[[1,7,'1–7 days',0],[8,14,'8–14 days',0],[15,30,'15–30 days',0],[31,1e9,'30+ days',0]]};
  ids.forEach(function(id){
    var i=wpInfo(id); c.tAll+=i.total; c.tDone+=i.done; c.tProg+=i.prog;
    if(i.closed){ c.wpClosed++; return; } c.wpOpen++;
    if(isActive(i)){ c.active++; if(!i.stale) c.freshN++; else c.unrev.push(i); }
    if(i.worst){ c.wpLate++; c.push.push(i); }
    i.lates.forEach(function(l){ if(l.kind==='start') c.lStart++; else c.lFin++; c.lateDays.push(l.days);
      c.buckets.forEach(function(b){ if(l.days>=b[0]&&l.days<=b[1]) b[3]++; }); });
  });
  c.push.sort(function(a,b){ return b.worst.days-a.worst.days||cmp(a.id,b.id); });
  c.unrev.sort(function(a,b){ var da=a.review?diff(a.review.at.slice(0,10),today):1e6, db=b.review?diff(b.review.at.slice(0,10),today):1e6; return db-da||cmp(a.id,b.id); });
  c.avg=c.lateDays.length?(c.lateDays.reduce(function(s,x){return s+x;},0)/c.lateDays.length):0;
  c.maxB=Math.max(1,Math.max.apply(null,c.buckets.map(function(b){return b[3];})));
  c.wpPct=(c.wpOpen+c.wpClosed)?Math.round(c.wpClosed/(c.wpOpen+c.wpClosed)*100):0; c.tPct=c.tAll?Math.round(c.tDone/c.tAll*100):0;
  c.freshPct=c.active?Math.round(c.freshN/c.active*100):100;
  c.people=IDX.people.filter(function(p){ return (resp==='All'||p===resp) && wpsFor(p,'sched').length; }).map(function(p){
    var o=0,lt=0,st=0,ol=0; wpsFor(p,'sched').forEach(function(id){ var i=wpInfo(id); if(i.closed) return; o++; lt+=i.lates.length; if(i.worst) ol++; if(i.stale&&isActive(i)) st++; });
    return {name:p,open:o,late:lt,lateWps:ol,stale:st}; });
  return c;
}
// Site items: their own figures, never mixed into the schedule statistics
function computeSite(resp){

  wpsFor(resp,'site').forEach(function(id){

    (IDX.byWp[id]||[]).forEach(function(t){ if(!t.start&&!t.finish&&eff(t.id)!=='C') c.noDates++; });
    if(i.closed){ c.gClosed++; return; } c.gOpen++;

  c.late.sort(function(a,b){ return b.worst.days-a.worst.days||cmp(a.id,b.id); });

function tkReq(id){ return (IDX.tk.byTank[id]||[]).filter(function(x){ return x.req==='Y'; }); }
function tkMatch(x,resp,disc){ return (resp==='All'||x.resp===resp) && (!disc||disc==='All'||x.disc===disc); }
function tkInfo(id,resp,disc){
  var today=todayISO(), soon=addDays(today,ACTIVE_DAYS), its=tkReq(id).filter(function(x){ return tkMatch(x,resp,disc); });
  var done=0, prog=0, lates=[], active=false, worst=null;
  its.forEach(function(x){ var st=eff(x.id); if(st==='C') done++; else { if(st==='P'){ prog++; active=true; } if(x.start&&x.start<=soon) active=true; }
    var l=late(x,st,today); if(l){ lates.push(l); if(!worst||l.days>worst.days) worst=l; } });
  var rv=S.reviews['TK|'+id], rdays=rv?diff(rv.at.slice(0,10),today):null;
  var closed=its.length>0&&done===its.length;
  return {id:id,items:its,total:its.length,done:done,prog:prog,lates:lates,worst:worst,closed:closed,
    active:active&&!closed, review:rv, stale:!rv||rdays>STALE_DAYS};
}
function discShort(d){ return {Structural:'Struct.',Electrical:'Elec.',Coatings:'Coating'}[d]||d; }
function tkStrip(id){

    var ys=all.filter(function(x){ return x.disc===d.name&&x.req==='Y'; }), ns=all.filter(function(x){ return x.disc===d.name&&x.req==='N'; });
    if(!ys.length) return '<div class="dc '+(ns.length?'X':'B')+'">'+esc(discShort(d.name))+'<small>'+(ns.length?'Not req.':'&nbsp;')+'</small></div>';
    var c=0,p=0,lt=false,today=todayISO(); ys.forEach(function(x){ var st=eff(x.id); if(st==='C') c++; else if(st==='P') p++; if(late(x,st,today)) lt=true; });

  }).join('')+'</div>';

function computeTanks(resp){
  var c={discs:[],work:0,done:0,iDone:0,iAll:0,iLate:0,stale:0,active:0,late:[]}, today=todayISO();
  IDX.tk.discs.forEach(function(d){ c.discs.push({name:d.name,leads:{},c:0,p:0,l:0,n:0}); });
  IDX.tk.tanks.forEach(function(t){
    var i=tkInfo(t.id,resp,'All'); if(!i.total) return;
    c.work++; if(i.closed) c.done++; if(i.active){ c.active++; if(i.stale) c.stale++; }
    if(i.worst) c.late.push([t,i]);
    i.items.forEach(function(x){ var st=eff(x.id), dd=c.discs.filter(function(z){return z.name===x.disc;})[0]; if(!dd) return;
      dd.n++; dd.leads[x.resp]=1; if(st==='C') dd.c++; else if(st==='P') dd.p++; if(late(x,st,today)){ dd.l++; c.iLate++; }
      c.iAll++; if(st==='C') c.iDone++; });
  });
  c.late.sort(function(a,b){ return b[1].worst.days-a[1].worst.days||cmp(a[0].id,b[0].id); });
  return c;
}

}

/* ---------- site items by stage (e.g. access openings: Open / Closed / Coating) ---------- */
// Site items whose IDs share a base (AO-01-OPEN, AO-01-CLOSE, AO-01-NDTC -> AO-01) form one row; the suffixes are the stages.
var FAM_NAMES={AO:'Hull access openings'};
function stageFamilies(){
  var bases={}, order=[];
  IDX.allT.forEach(function(t){ if(!t.site||IDX.tasks[t.id]!==t) return; var m=/^(.+)-([^-]+)$/.exec(t.id); if(!m) return;
    if(!bases[m[1]]){ bases[m[1]]={id:m[1],items:[]}; order.push(m[1]); } bases[m[1]].items.push(t); });
  var fams={}, forder=[];
  order.forEach(function(b){ var x=bases[b]; if(x.items.length<2) return; var p=b.split('-')[0];
    if(!fams[p]){ fams[p]={id:p,rows:[],stages:[],sk:{}}; forder.push(p); } var f=fams[p]; f.rows.push(x);
    x.items.forEach(function(t){ var k=t.id.slice(b.length+1); if(!f.sk[k]){ f.sk[k]={key:k,name:t.name,resp:[]}; f.stages.push(f.sk[k]); }
      var r=(IDX.wps[t.wp]||{}).resp; if(r&&f.sk[k].resp.indexOf(r)<0) f.sk[k].resp.push(r); }); });
  return forder.map(function(p){ var f=fams[p]; f.rows.sort(function(a,b){ return cmp(a.id,b.id); }); f.name=FAM_NAMES[p]||('Site items '+p); return f; });
}
function stageWord(name){ var n=name.toLowerCase(); return /coat/.test(n)?'Coated':/clos/.test(n)?'Closed':/open/.test(n)?'Open':name+' done'; }
function stageNone(f){ return f.stages.length&&stageWord(f.stages[0].name)==='Open'?'Not opened':'Not started'; }
function stageRow(f,row){
  var today=todayISO(), by={}; row.items.forEach(function(t){ by[t.id.slice(row.id.length+1)]=t; });
  var cells=f.stages.map(function(s){ var t=by[s.key]; if(!t) return null; var st=eff(t.id); return {t:t,st:st,l:late(t,st,today),rec:S.status[t.id]}; });
  var last=-1, prog=-1; cells.forEach(function(c,i){ if(c&&c.st==='C') last=i; });
  cells.forEach(function(c,i){ if(c&&c.st==='P'&&i>last&&prog<0) prog=i; });
  var w=IDX.wps[row.id]||IDX.wps[row.items[0].wp]||{desc:''};
  var loc=String(w.desc||'').replace(/^ACCESS POINT\s*\d+\s*[–-]\s*/i,'').replace(/\s*[–-]\s*COATING$/i,'');
  return {cells:cells,last:last,prog:prog,state:last<0?stageNone(f):stageWord(f.stages[last].name),
    done:cells.every(function(c){ return !c||c.st==='C'; }),late:cells.some(function(c){ return c&&c.l; }),loc:loc};
}
function repStages(fid){
  var R=S.rep, fams=stageFamilies(), f=fams.filter(function(x){ return x.id===fid; })[0]||fams[0];
  if(!f) return '<p class="note">No site items with stages.</p>';
  var rows=f.rows.filter(function(r){ return R.resp==='All'||r.items.some(function(t){ return (IDX.wps[t.wp]||{}).resp===R.resp; }); })
    .map(function(r){ return [r,stageRow(f,r)]; });
  var states=[stageNone(f)].concat(f.stages.map(function(s){ return stageWord(s.name); })), cnt={};
  rows.forEach(function(x){ cnt[x[1].state]=(cnt[x[1].state]||0)+1; });
  var nLate=rows.filter(function(x){ return x[1].late; }).length, n=f.stages.length;
  var lvl=function(i){ return i<0?'s0':i===n-1?'sF':'s'+(1+(i%2)); };
  var cell=function(c,k){
    var g=k===0?' gs':'';
    if(!c) return '<td class="c'+g+'"><span class="nrd">·</span></td>';
    var mark={C:'✓',P:'IP',N:''}[c.st], dt;
    if(c.st==='C') dt=c.rec&&c.rec.at?fmt(c.rec.at.slice(0,10)):'';
    else { var d=c.t.finish||c.t.start; dt=(c.l?'!':'')+(d?fmt(d):'–'); }
    return '<td class="c'+g+'"><span class="tm '+c.st+(c.l?' L':'')+'">'+mark+'</span><span class="tdt'+(c.l?' lt':'')+'">'+dt+'</span></td>';
  };
  var body=rows.map(function(x){ var r=x[0], i=x[1];
    return '<tr><td class="ttid"><b>'+esc(r.id)+'</b><span>'+esc(i.loc)+'</span></td>'+i.cells.map(cell).join('')+
      '<td class="sst"><span class="spill '+lvl(i.last)+'">'+esc(i.state)+'</span>'+(i.prog>=0?'<small>'+esc(f.stages[i.prog].name)+' in progress</small>':'')+'</td></tr>'; }).join('');
  var foot=f.stages.map(function(s,k){ var tot=0,c=0; rows.forEach(function(x){ var z=x[1].cells[k]; if(z){ tot++; if(z.st==='C') c++; } });
    return '<td class="c'+(k===0?' gs':'')+'">'+c+'/'+tot+'</td>'; }).join('');
  var title=f.name+(R.resp==='All'?'':' – '+R.resp);
  return '<section class="trep">'+
    '<div class="ttop"><div><div class="reye">'+esc((S.site&&S.site.source)||'Site items')+'</div><h1>'+esc(title)+'</h1>'+
      '<div class="rmeta">Current stage of each item, as reported by the site team · '+esc(stamp())+'</div>'+
      '<div class="tkp">'+states.map(function(st,j){ return '<div><b>'+(cnt[st]||0)+'</b>'+esc(st)+'</div>'; }).join('')+
        '<div class="lt"><b>'+nLate+'</b>with a late stage</div></div></div>'+
      '<div class="tlg"><div><span class="tm C">✓</span>Complete + date reported</div><div><span class="tm P">IP</span>In progress + planned date</div>'+
      '<div><span class="tm N"></span>Not started + planned date</div><div><span class="tm N L"></span><span class="tdt lt">!24 Oct</span>Late</div>'+
      '<div><span class="tdt">–</span>No planned date</div></div></div>'+
    '<div class="scroll"><table class="tmx smx"><thead><tr><th class="ttid">'+esc(f.id==='AO'?'Access point':'Item')+'</th>'+
      f.stages.map(function(s,k){ return '<th class="grp g'+(k%4)+(k===0?' gs':'')+'">'+esc(s.name)+'<span>'+esc(s.resp.join(', '))+'</span></th>'; }).join('')+
      '<th class="sst">Current stage</th></tr></thead><tbody>'+body+'</tbody><tfoot><tr><td>Complete</td>'+foot+'<td></td></tr></tfoot></table></div></section>';
}

}

      (LIVE?'<button class="btn wide" data-act="tankpublish">Publish tank list</button>':'<div class="note">In demo mode the upload is read and checked but not published.</div>'):'')+
    '</div>';
  body+='<div class="card"><b>Excel export</b><span class="note">Your backup: current status of every schedule task, site item and tank item, plus the full change log and review dates.</span><button class="btn wide" data-act="export">Download Excel</button>'+
    (LIVE?'':'<span class="note">Downloads are blocked in this preview page. They work in the live app.</span>')+'</div>';
  if(!LIVE) body+=S.resetAsk?'<div class="confirm"><b>Clear all demo updates on this phone?</b><div class="row"><button class="btn" data-act="resetyes">Yes, clear</button><button class="btn ghost" data-act="resetno">Cancel</button></div></div>'
    :'<button class="btn ghost wide" data-act="reset">Clear demo updates</button>';
  if(S.adminErr) body+='<div class="err">'+esc(S.adminErr)+'</div>';
  if(S.adminMsg) body+='<div class="note"><b>'+esc(S.adminMsg)+'</b></div>';
  return header('Admin')+'<main><div class="wrap"><section class="sec"><button class="link" data-act="tab" data-v="stats">← Back to statistics</button>'+body+'</section></div></main>'+tabs();
}
// The Excel library is only loaded on the admin page, so phones never download it.
var XLSX_SRC=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
function needXLSX(){ return new Promise(function(res,rej){
  if(window.XLSX) return res(window.XLSX);
  (function next(i){
    if(i>=XLSX_SRC.length) return rej(new Error('Could not load the Excel reader. Check the connection and try again.'));
    var s=document.createElement('script'); s.src=XLSX_SRC[i];
    s.onload=function(){ window.XLSX?res(window.XLSX):next(i+1); }; s.onerror=function(){ next(i+1); };
    document.head.appendChild(s);
  })(0); }); }
function doExport(){
  var getData = LIVE ? api('/api/export',{admin:true}) : Promise.resolve({log:ls('demo_log')||[]});
  Promise.all([needXLSX(),getData]).then(function(r){
    var X=r[0], d=r[1], today=todayISO();
    var rows=IDX.allT.slice().sort(function(a,b){return (a.site?1:0)-(b.site?1:0)||cmp(a.wp,b.wp)||cmp(a.id,b.id);}).map(function(t){
      var w=IDX.wps[t.wp], s=S.status[t.id], st=eff(t.id), l=late(t,st,today);
      return {'Source':t.site?'Site items':'Schedule','Workpack':t.wp,'Workpack description':w.desc,'Responsible':w.resp,'Task ID':t.id,'Group':t.grp,'Task':t.name,
        'Planned start':t.start,'Planned finish':t.finish,'Status':{N:'Not Started',P:'In Progress',C:'Complete'}[st],
        'Status source':s?'Site team':(t.site?'Site items file':'Planner (P6)'),'Updated by':s?s.by:'','Updated at':s?s.at:'',
        'Late':l?(l.kind==='finish'?'Late to finish':'Late to start'):'','Days late':l?l.days:''};
    });
    var log=(d.log||[]).map(function(e){ return {'Time (UTC)':e.at,'By':e.by,'Workpack':e.wp,'Task ID':e.task,'From':e.old||'','To':e.new}; });
    var rv=IDX.allW.map(function(w){ var r=S.reviews[w.id]; return {'Source':w.site?'Site items':'Schedule','Workpack':w.id,'Description':w.desc,'Responsible':w.resp,'Last reviewed (UTC)':r?r.at:'','Reviewed by':r?r.by:''}; });
    var wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(rows),'Task status');
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(log.length?log:[{'Time (UTC)':'','By':'','Workpack':'','Task ID':'','From':'','To':''}]),'Change log');
    X.utils.book_append_sheet(wb,X.utils.json_to_sheet(rv),'Workpack reviews');
    if(IDX.tk.has){
      var trows=[]; IDX.tk.tanks.forEach(function(t){ var r=S.reviews['TK|'+t.id];
        (IDX.tk.byTank[t.id]||[]).forEach(function(x){ var s2=S.status[x.id], st=x.req==='Y'?eff(x.id):null, l=st?late(x,st,today):null;
          trows.push({'Tank ID':t.id,'Tank / seachest':t.name,'Discipline':x.disc,'Item':x.item,'Required':x.req,'Responsible':x.resp,
            'Planned start':x.start||'','Planned finish':x.finish||'','Status':st?{N:'Not Started',P:'In Progress',C:'Complete'}[st]:'',
            'Updated by':s2?s2.by:'','Updated at':s2?s2.at:'','Late':l?(l.kind==='finish'?'Late to finish':'Late to start'):'','Days late':l?l.days:'',
            'Tank last reviewed (UTC)':r?r.at:'','Reviewed by':r?r.by:''}); }); });
      X.utils.book_append_sheet(wb,X.utils.json_to_sheet(trows),'Tanks');
    }
    X.writeFile(wb,'Workpack status '+today+'.xlsx');
    S.adminErr=''; S.adminMsg='Export created.'; render();
  }).catch(function(e){ S.adminErr=e.message; S.adminMsg=''; render(); });
}

/* ---------- overlays: PIN and name ---------- */
function viewPin(err){
  app.innerHTML='<div class="overlay"><div class="wrap"><div class="brand">Workpack Status</div><p>Enter the team PIN to open the schedule.</p>'+
    '<label class="lbl" for="pin">Team PIN</label><input id="pin" class="text" type="password" autocomplete="current-password">'+
    (err?'<div class="err">'+esc(err)+'</div>':'')+'<button class="btn wide" data-act="pin">Open</button></div></div>';
}
function viewWho(){
  var me=ls('me');
  return '<div class="overlay"><div class="wrap"><div class="brand">Who are you?</div><p class="note">Your updates are recorded under this name. The phone remembers it.</p>'+
    IDX.allPeople.filter(function(p){ return p!=='Unassigned'; }).map(function(p){ return '<button class="namebtn" data-act="me" data-n="'+esc(p)+'">'+esc(p)+'</button>'; }).join('')+
    '<button class="namebtn" data-act="me" data-n="Management">Management (view all)</button>'+
    (me?'<button class="link" data-act="whoclose">Cancel</button>':'')+'</div></div>';
}

/* ---------- render + events ---------- */
function render(){
  var y=window.scrollY, v=S.view;
  if(S.who){ app.innerHTML=viewWho(); return; }
  app.innerHTML = v==='wp'?viewWp():v==='stats'?viewStats():v==='admin'?viewAdmin():v==='reports'?viewReports():v==='tanks'?viewTanks():v==='tank'?viewTank():v==='review'?viewReview():viewList();
  var pg=document.getElementById('pgsz'); if(pg) pg.textContent=(v==='reports'&&S.rep.type==='tanks')?'@page{size:17in 11in;margin:.35in .4in .45in}':'@page{size:A4;margin:12mm}';
  if(S.focusTq){ var q=document.getElementById('tq'); if(q){ q.focus(); var n=q.value.length; try{ q.setSelectionRange(n,n); }catch(e){} } S.focusTq=false; }
  window.scrollTo(0,S.keepScroll?y:0); S.keepScroll=false;
}
function rerender(){ S.keepScroll=true; render(); }
function setPeriod(span){ S.span=span; S.from=todayISO(); S.to=addDays(S.from,span); ls('span',span); }
function leaveWp(){ S.pending={}; S.confirmAll=false; S.view=S.ret||(S.view==='tank'?'tanks':'list'); S.ret=null; render(); }

app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act');
  if(a==='pin'){ var v=document.getElementById('pin').value.trim(); if(!v) return; ls('pin',v); start(); return; }
  if(a==='who'){ S.who=true; render(); return; }
  if(a==='whoclose'){ S.who=false; render(); return; }
  if(a==='me'){ var n=el.getAttribute('data-n'); ls('me',n); S.who=false; S.resp=(n==='Management')?'All':n; ls('resp',S.resp); S.rep.resp=S.resp; S.tresp=IDX.tkPeople.indexOf(n)>=0?n:'All'; render(); return; }
  if(a==='tank'){ S.ret=S.view==='review'?'review':null; S.tank=el.getAttribute('data-id'); S.pending={}; S.view='tank'; render(); return; }
  if(a==='review'){ S.view='review'; S.rvWho=null; render(); return; }
  if(a==='remind'){ var rp=el.getAttribute('data-p'), rn=toReview(rp).length; S.share={p:rp,text:remindText(rp,rn)};
    if(navigator.share){ navigator.share({title:'Workpack Status',text:S.share.text}).then(function(){ S.share=null; toast('Reminder shared'); rerender(); }).catch(function(){ rerender(); }); }
    else rerender(); return; }
  if(a==='rmclose'){ S.share=null; rerender(); return; }
  if(a==='rmcopy'){ var tx=document.getElementById('rmtext'); var v2=tx?tx.value:S.share.text;
    (navigator.clipboard?navigator.clipboard.writeText(v2):Promise.reject()).then(function(){ toast('Copied'); }).catch(function(){ if(tx){ tx.focus(); tx.select(); } toast('Select the text and copy it'); }); return; }
  if(a==='unlock'){ readAdminPin(); if(!S.adminPin){ S.adminErr='Enter the admin PIN first.'; rerender(); return; }
    (LIVE?api('/api/export',{admin:true}):Promise.resolve()).then(function(){ S.isAdmin=true; ls('isadmin',true); S.adminErr=''; S.adminMsg='Reminders unlocked on this device. They appear at the top of Statistics.'; rerender(); })
      .catch(function(e){ S.adminErr=e.code===401?'Admin PIN not accepted.':e.message; rerender(); }); return; }
  if(a==='lock'){ S.isAdmin=false; ls('isadmin',false); S.adminMsg='Reminders hidden on this device.'; rerender(); return; }
  if(a==='tdisc'){ S.tdisc=el.getAttribute('data-v'); ls('tdisc',S.tdisc); rerender(); return; }
  if(a==='tab'){ if((S.view==='wp'||S.view==='tank')&&pendingCount()){ toast('Press Update first, or go back to discard.'); return; } S.view=el.getAttribute('data-v'); S.pending={}; render(); return; }
  if(a==='fold'){ var k=el.getAttribute('data-k'); S.open[k]=!S.open[k]; rerender(); return; }
  if(a==='span'){ setPeriod(+el.getAttribute('data-n')); rerender(); return; }
  if(a==='src'){ S.src=el.getAttribute('data-v'); ls('src',S.src); rerender(); return; }
  if(a==='edit'){ S.ret=S.view==='review'?'review':null; S.wp=el.getAttribute('data-wp'); S.pending={}; S.confirmAll=false; S.view='wp'; render(); return; }
  if(a==='back'){ if(pendingCount()&&!S.discardAsk){ S.discardAsk=true; toast('Unsaved changes. Tap back again to discard them.'); setTimeout(function(){S.discardAsk=false;},4000); return; } S.discardAsk=false; leaveWp(); return; }
  if(a==='set'){
    var id=el.getAttribute('data-t'), s=el.getAttribute('data-s');
    if(s===eff(id)) delete S.pending[id]; else S.pending[id]=s;
    var card=document.getElementById('t-'+id); if(card) card.outerHTML=taskCard(IDX.tasks[id]);
    var u=document.getElementById('updtext'); if(u) u.textContent=updText();
    return;
  }
  if(a==='all'){ S.confirmAll=true; rerender(); return; }
  if(a==='allno'){ S.confirmAll=false; rerender(); return; }
  if(a==='allyes'){ (IDX.byWp[S.wp]||[]).forEach(function(t){ if(eff(t.id)!=='C') S.pending[t.id]='C'; }); S.confirmAll=false; rerender(); return; }
  if(a==='save'){
    if(S.saving) return;
    var ch=Object.keys(S.pending).map(function(id){ return {id:id,s:S.pending[id],old:eff(id)}; }), wp=S.view==='tank'?'TK|'+S.tank:S.wp;
    S.saving=true; rerender();
    sendUpdate(wp,ch).then(function(){
      S.saving=false; index(); var n=ch.length;
      toast(wp.replace(/^TK\|/,'')+(n?' saved: '+n+(n===1?' change':' changes'):' marked reviewed'));
      leaveWp();
    }).catch(function(e){ S.saving=false; rerender(); toast(e.code===401?'PIN not accepted. Reopen the app.':'Not saved. Check your signal and press Update again.'); });
    return;
  }
  if(a==='print'){ try{ window.print(); }catch(e){} return; }
  if(a==='admin'){ S.view='admin'; S.adminMsg=''; S.adminErr=''; render(); return; }
  if(a==='export'){ readAdminPin(); doExport(); return; }
  if(a==='reset'){ S.resetAsk=true; rerender(); return; }
  if(a==='resetno'){ S.resetAsk=false; rerender(); return; }
  if(a==='resetyes'){ ls('demo_status',{}); ls('demo_reviews',{}); ls('demo_log',[]); S.status={}; S.reviews={}; S.resetAsk=false; S.adminMsg='Demo updates cleared.'; rerender(); return; }
  if(a==='sitepublish'){
    readAdminPin(); var sp=S.siteParsed; if(!sp) return;
    S.adminMsg='Publishing site items…'; S.adminErr=''; rerender();
    api('/api/site',{method:'POST',admin:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({v:sp.v,kind:'site',source:sp.source,imported:sp.imported,workpacks:sp.workpacks,tasks:sp.tasks})})
      .then(function(){ return load(); }).then(function(){ index(); S.siteParsed=null; S.adminMsg='Site items published.'; rerender(); })
      .catch(function(e){ S.adminMsg=''; S.adminErr=e.code===401?'Admin PIN not accepted.':e.message; rerender(); });
    return;
  }
  if(a==='tankpublish'){
    readAdminPin(); var tp=S.tankParsed; if(!tp) return;
    S.adminMsg='Publishing tank list…'; S.adminErr=''; rerender();
    api('/api/tanks',{method:'POST',admin:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({v:tp.v,kind:'tanks',source:tp.source,imported:tp.imported,disciplines:tp.disciplines,tanks:tp.tanks,items:tp.items})})
      .then(function(){ return load(); }).then(function(){ index(); S.tankParsed=null; S.adminMsg='Tank list published.'; rerender(); })
      .catch(function(e){ S.adminMsg=''; S.adminErr=e.code===401?'Admin PIN not accepted.':e.message; rerender(); });
    return;
  }
  if(a==='publish'){
    readAdminPin(); var p=S.adminParsed; if(!p) return;
    S.adminMsg='Publishing…'; S.adminErr=''; rerender();
    var body=JSON.stringify({v:p.v,source:p.source,imported:p.imported,phases:p.phases,workpacks:p.workpacks,tasks:p.tasks});
    api('/api/schedule',{method:'POST',admin:true,headers:{'Content-Type':'application/json'},body:body})
      .then(function(){ return load(); }).then(function(){ index(); S.adminParsed=null; S.adminMsg='Published. Everyone sees the new schedule next time they open the app.'; rerender(); })
      .catch(function(e){ S.adminMsg=''; S.adminErr=e.code===401?'Admin PIN not accepted.':e.message; rerender(); });
    return;
  }
});
function readAdminPin(){ var el=document.getElementById('apin'); if(el) S.adminPin=el.value.trim(); }
app.addEventListener('input',function(ev){
  var el=ev.target; if(el.getAttribute('data-act')==='tq'){ S.tq=el.value; S.focusTq=true; rerender(); }
});
app.addEventListener('change',function(ev){
  var el=ev.target, a=el.getAttribute('data-act');
  if(a==='resp'){ S.resp=el.value; ls('resp',S.resp); rerender(); }
  if(a==='sresp'){ S.statsResp=el.value; rerender(); }
  if(a==='rtype'){ S.rep.type=el.value; if(el.value==='tanks') S.rep.resp='All'; rerender(); }
  if(a==='rresp'){ S.rep.resp=el.value; rerender(); }
  if(a==='rscope'){ S.rep.scope=el.value; rerender(); }
  if(a==='ronly'){ S.rep.only=el.value; rerender(); }
  if(a==='rsrc'){ S.rep.src=el.value; rerender(); }
  if(a==='rvwho'){ S.rvWho=el.value||null; rerender(); }
  if(a==='tresp'){ S.tresp=el.value; ls('tresp',S.tresp); rerender(); }
  if(a==='tankfile'&&el.files&&el.files[0]){
    readAdminPin(); var tf=el.files[0]; S.adminMsg='Reading '+tf.name+'…'; S.adminErr=''; S.tankParsed=null; rerender();
    Promise.all([needXLSX(),tf.arrayBuffer()]).then(function(r){
      var tp=WPParse.parseTankWorkbook(r[0],r[1],tf.name); if(!tp.tanks.length) throw new Error('No tanks found in that file.');
      S.tankParsed=tp; S.adminMsg=''; rerender();
    }).catch(function(e){ S.adminMsg=''; S.adminErr='Could not read the tank file: '+(/encrypt|password|CFB|ole/i.test(e.message)?'it looks protected. Remove the sensitivity label or password and save it again.':e.message); rerender(); });
  }
  if(a==='rdone'){ S.rep.done=!!el.checked; ls('repdone',S.rep.done); rerender(); }
  if(a==='sitefile'&&el.files&&el.files[0]){
    readAdminPin(); var sf=el.files[0]; S.adminMsg='Reading '+sf.name+'…'; S.adminErr=''; S.siteParsed=null; rerender();
    Promise.all([needXLSX(),sf.arrayBuffer()]).then(function(r){
      var sp=WPParse.parseSiteWorkbook(r[0],r[1],sf.name);
      var clash=sp.tasks.filter(function(t){ var x=IDX.tasks[t.id]; return x&&!x.site; }).map(function(t){return t.id;});
      if(clash.length) throw new Error('These Item IDs are already used by the schedule: '+clash.slice(0,5).join(', ')+'. Give them a different prefix.');
      var gclash=sp.workpacks.filter(function(w){ var x=IDX.wps[w.id]; return x&&!x.site; }).map(function(w){return w.id;});
      if(gclash.length) throw new Error('These Group Nos are already schedule workpack numbers: '+gclash.join(', ')+'.');
      S.siteParsed=sp; S.adminMsg=''; rerender();
    }).catch(function(e){ S.adminMsg=''; S.adminErr='Could not read the site items file: '+e.message; rerender(); });
  }
  if(a==='from'&&el.value){ S.from=el.value; S.span=0; if(S.to<S.from) S.to=S.from; rerender(); }
  if(a==='to'&&el.value){ S.to=el.value; S.span=0; rerender(); }
  if(a==='file'&&el.files&&el.files[0]){
    readAdminPin(); var f=el.files[0]; S.adminMsg='Reading '+f.name+'…'; S.adminErr=''; S.adminParsed=null; rerender();
    Promise.all([needXLSX(),f.arrayBuffer()]).then(function(r){
      var p=WPParse.parseWorkbook(r[0],r[1],f.name); if(!p.tasks.length) throw new Error('No construction tasks found in that file.');
      S.adminParsed=p; S.adminMsg=''; rerender();
    }).catch(function(e){ S.adminMsg=''; S.adminErr='Could not read the file: '+e.message; rerender(); });
  }
});

function start(){
  if(!LIVE && !window.WP_DEMO){ app.innerHTML='<div class="overlay"><div class="wrap"><div class="brand">Workpack Status</div><p class="err">This app is not connected yet.</p><p class="note">Add the Cloudflare Worker address to config.js, then reload.</p></div></div>'; return; }
  if(LIVE && !pin()){ viewPin(); return; }
  app.innerHTML='<div class="overlay"><div class="wrap"><div class="brand">Workpack Status</div><p class="note">Loading the schedule…</p></div></div>';
  load().then(function(){
    index();
    var me=ls('me'); S.resp=ls('resp')||(me&&me!=='Management'?me:'All');
    if(S.resp!=='All'&&IDX.people.indexOf(S.resp)<0) S.resp='All';
    setPeriod(ls('span')||14);
    S.src=ls('src')||'all'; if(['all','sched','site'].indexOf(S.src)<0) S.src='all';
    S.rep={type:'wp',resp:S.resp,scope:'period',only:'out',src:'all',done:!!ls('repdone')};
    var tr=ls('tresp'); S.tresp=(tr&&(tr==='All'||IDX.tkPeople.indexOf(tr)>=0))?tr:(IDX.tkPeople.indexOf(me)>=0?me:'All'); S.tdisc=ls('tdisc')||'All'; S.tq='';
    S.isAdmin=!!ls('isadmin');
    if(location.hash==='#review'){ S.view='review'; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
    S.who=!me; render();
  }).catch(function(e){
    if(e.code===401){ try{localStorage.removeItem('wp_pin');}catch(x){} viewPin('That PIN was not accepted. Try again.'); return; }
    app.innerHTML='<div class="overlay"><div class="wrap"><div class="brand">Workpack Status</div><p class="err">Could not reach the server.</p><p class="note">'+esc(e.message)+'</p><button class="btn wide" onclick="location.reload()">Try again</button></div></div>';
  });
}
window.addEventListener('hashchange',function(){
  if(location.hash==='#review'&&IDX&&!pendingCount()){ S.view='review'; S.rvWho=null; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} render(); }
});
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&LIVE&&S.sched&&S.view!=='wp'&&S.view!=='tank'){ load().then(function(){ index(); rerender(); }).catch(function(){}); } });
start();
})();
</script>
